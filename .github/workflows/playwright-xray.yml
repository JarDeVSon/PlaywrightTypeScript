name: Playwright - Xray Cloud

on:
  workflow_dispatch:
    inputs:
      # =====================================================
      # XRAY PROJECT
      # =====================================================
      projectKey:
        description: "Xray Project Key"
        required: true
        type: string

      # =====================================================
      # XRAY TEST PLAN (OPCIONAL NO XRAY STANDARD)
      # =====================================================
      testPlanKey:
        description: "Xray Test Plan Key (Apenas Xray Enterprise)"
        required: false
        default: ""
        type: string

      # =====================================================
      # XRAY TEST EXECUTION (OPCIONAL)
      # =====================================================
      testExecutionKey:
        description: "Existing Xray Test Execution Key (Leave empty to create new)"
        required: false
        default: ""
        type: string

      # =====================================================
      # APPLICATION ENVIRONMENT
      # =====================================================
      environment:
        description: "Application environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

      # =====================================================
      # PLAYWRIGHT SUITE
      # =====================================================
      testSuite:
        description: "Playwright suite"
        required: true
        type: choice
        options:
          - web
          - api
          - visual
          - accessibility

      # =====================================================
      # OPTIONAL GREP
      # =====================================================
      grep:
        description: "Optional Playwright grep/tag"
        required: false
        default: ""
        type: string

# ===========================================================
# JOB
# ===========================================================
jobs:
  build:
    runs-on: ubuntu-latest

    # =======================================================
    # DYNAMIC GITHUB ENVIRONMENT
    # =======================================================
    environment:
      name: ${{ inputs.environment }}

    # =======================================================
    # ENVIRONMENT VARIABLES
    # =======================================================
    env:
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      BASE_URL: ${{ vars.BASE_URL }}
      TEST_ENVIRONMENT: ${{ inputs.environment }}
      TEST_SUITE: ${{ inputs.testSuite }}
      XRAY_PROJECT_KEY: ${{ inputs.projectKey }}
      XRAY_TEST_PLAN: ${{ inputs.testPlanKey }}
      XRAY_TEST_EXECUTION: ${{ inputs.testExecutionKey }}

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE.JS
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: npm i

      # =====================================================
      # INSTALL CHROMIUM ONLY
      # =====================================================
      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium

      # =====================================================
      # DISPLAY EXECUTION CONFIGURATION
      # =====================================================
      - name: Display execution configuration
        shell: bash
        run: |
          echo "=============================================="
          echo "PLAYWRIGHT + XRAY EXECUTION"
          echo "=============================================="
          echo "Xray Project: $XRAY_PROJECT_KEY"
          echo "Xray Test Plan: ${XRAY_TEST_PLAN:-'(Nenhum - Xray Standard)'}"
          echo "Xray Test Execution: ${XRAY_TEST_EXECUTION:-'(A new Test Execution will be created)'}"
          echo "Application Environment: $TEST_ENVIRONMENT"
          echo "Playwright Suite: $TEST_SUITE"
          echo "BASE_URL: $BASE_URL"
          echo "Jira: $JIRA_BASE_URL"
          echo "=============================================="

      # =====================================================
      # VALIDATE CONFIGURATION
      # =====================================================
      - name: Validate configuration
        shell: bash
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::BASE_URL is empty. Check GitHub Environment variables."
            exit 1
          fi

          if [ -z "$JIRA_BASE_URL" ]; then
            echo "::error::JIRA_BASE_URL is empty. Check repository variables."
            exit 1
          fi

          if [ -z "$XRAY_PROJECT_KEY" ]; then
            echo "::error::Xray Project Key is required."
            exit 1
          fi

          echo "Configuration validation passed."

      # =====================================================
      # RUN PLAYWRIGHT
      # =====================================================
      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        shell: bash
        run: |
          echo "Running Playwright project: $TEST_SUITE"
          echo "Environment: $TEST_ENVIRONMENT"
          echo "BASE_URL: $BASE_URL"

          if [ -n "${{ inputs.grep }}" ]; then
            echo "Grep: ${{ inputs.grep }}"
            PLAYWRIGHT_JUNIT_OUTPUT_NAME=xray-report.xml npx playwright test \
              --project="$TEST_SUITE" \
              --reporter=@xray-app/playwright-junit-reporter \
              --grep "${{ inputs.grep }}"
          else
            PLAYWRIGHT_JUNIT_OUTPUT_NAME=xray-report.xml npx playwright test \
              --reporter=@xray-app/playwright-junit-reporter \
              --project="$TEST_SUITE"
          fi

      # =====================================================
      # VERIFY JUNIT REPORT
      # =====================================================
      - name: Verify JUnit report
        if: always()
        shell: bash
        run: |
          echo "Checking Xray JUnit report..."

          if [ ! -f "xray-report.xml" ]; then
            echo "::error::xray-report.xml was not generated."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          ls -lh xray-report.xml

      # =====================================================
      # UPLOAD PLAYWRIGHT ARTIFACTS
      # =====================================================
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ inputs.testSuite }}-${{ inputs.environment }}
          path: |
            xray-report.xml
            playwright-report/
            test-results/
          if-no-files-found: warn

      # =====================================================
      # DEBUG VIA CURL DIRECTO NA API DO XRAY
      # =====================================================
      - name: Debug Xray Import via cURL
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo "TESTANDO IMPORTAÇÃO DIRETA NA API DO XRAY (DEBUG)"
          echo "=============================================="

          # 1. Obter Token OAuth2
          TOKEN_RESPONSE=$(curl -s -H "Content-Type: application/json" \
            -X POST \
            --data "{\"client_id\": \"${{ secrets.XRAYCLOUD_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.XRAYCLOUD_CLIENT_SECRET }}\"}" \
            https://xray.cloud.getxray.app/api/v2/authenticate)

          # Limpa as aspas do token retornado
          TOKEN=$(echo $TOKEN_RESPONSE | tr -d '"')

          if [ -z "$TOKEN" ] || [[ "$TOKEN" == *"error"* ]]; then
            echo "::error::Falha ao autenticar no Xray Cloud. Resposta: $TOKEN_RESPONSE"
            exit 1
          fi

          echo "Autenticação no Xray realizada com sucesso!"

          # 2. Montar URL com parâmetros (sem testPlanKey para Xray Standard)
          URL="https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=$XRAY_PROJECT_KEY"

          if [ -n "$XRAY_TEST_EXECUTION" ]; then
            URL="${URL}&testExecKey=${XRAY_TEST_EXECUTION}"
          fi

          echo "Endpoint chamado: $URL"
          echo "Resposta detalhada da API do Jira/Xray:"
          echo "----------------------------------------------"

          # 3. Disparar importação com payload XML bruto
          curl -v -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: text/xml" \
            --data-binary @"xray-report.xml" \
            "$URL"

          echo ""
          echo "----------------------------------------------"

      # =====================================================
      # IMPORT RESULTS TO XRAY (MIKEPENZ)
      # =====================================================
      - name: Import results to Xray
        id: xray
        if: always()
        uses: mikepenz/xray-action@4.1.1
        with:
          username: ${{ secrets.XRAYCLOUD_CLIENT_ID }}
          password: ${{ secrets.XRAYCLOUD_CLIENT_SECRET }}
          # xrayCloud: "true"
          # xrayBaseUrl: ${{ vars.XRAYCLOUD_BASE_URL }}
          testFormat: "junit"
          testPaths: "xray-report.xml"
          projectKey: "${{ inputs.projectKey }}"
          testExecKey: "${{ inputs.testExecutionKey }}"
          

      # =====================================================
      # XRAY RESULT
      # =====================================================
      - name: Display Xray Test Execution
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo "XRAY RESULT"
          echo "=============================================="
          echo "Test Plan: ${XRAY_TEST_PLAN:-'Nenhum informado'}"
          echo "Test Execution Key Utilizada: ${XRAY_TEST_EXECUTION:-'(Gerada uma nova via API)'}"
          echo "=============================================="

      # =====================================================
      # GITHUB SUMMARY
      # =====================================================
      - name: Add execution summary
        if: always()
        shell: bash
        run: |
          echo "# Playwright + Xray Execution" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Project | $XRAY_PROJECT_KEY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Plan | ${XRAY_TEST_PLAN:-'N/A'} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Execution | ${XRAY_TEST_EXECUTION:-'Criada Automaticamente'} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Application Environment | $TEST_ENVIRONMENT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Suite | $TEST_SUITE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Base URL | $BASE_URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Xray" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$XRAY_TEST_PLAN" ]; then
            echo "[Open Test Plan]($JIRA_BASE_URL/browse/$XRAY_TEST_PLAN)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$XRAY_TEST_EXECUTION" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Open Test Execution]($JIRA_BASE_URL/browse/$XRAY_TEST_EXECUTION)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # =====================================================
      # FINAL PLAYWRIGHT STATUS
      # =====================================================
      - name: Fail workflow if Playwright failed
        if: steps.playwright.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Playwright tests failed."
          echo "The Xray import was still attempted."
          exit 1
