name: Playwright - Xray Cloud

on:
  workflow_dispatch:
    inputs:
      # =====================================================
      # XRAY PROJECT
      # =====================================================

      projectKey:
        description: "Xray Project Key"

        required: true

        type: string

      # =====================================================
      # XRAY TEST PLAN
      # =====================================================

      testPlanKey:
        description: "Xray Test Plan Key"

        required: true

        type: string


      # =====================================================
      # APPLICATION ENVIRONMENT
      # =====================================================

      environment:
        description: "Application environment"

        required: true

        type: choice

        options:
          - dev
          - qa
          - staging
          - production

      # =====================================================
      # PLAYWRIGHT SUITE
      # =====================================================

      testSuite:
        description: "Playwright suite"

        required: true

        type: choice

        options:
          - web
          - api
          - visual
          - accessibility

      # =====================================================
      # OPTIONAL GREP
      # =====================================================

      grep:
        description: "Optional Playwright grep/tag"

        required: false

        default: ""

        type: string

# ===========================================================
# JOB
# ===========================================================

jobs:
  build:
    runs-on: ubuntu-latest

    # =======================================================
    # DYNAMIC GITHUB ENVIRONMENT
    # =======================================================

    environment:
      name: ${{ inputs.environment }}

    # =======================================================
    # ENVIRONMENT VARIABLES
    # =======================================================

    env:
      # -----------------------------------------------------
      # Jira / Atlassian
      # -----------------------------------------------------

      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}

      # -----------------------------------------------------
      # Application
      # -----------------------------------------------------

      BASE_URL: ${{ vars.BASE_URL }}

      # -----------------------------------------------------
      # Execution
      # -----------------------------------------------------

      TEST_ENVIRONMENT: ${{ inputs.environment }}

      TEST_SUITE: ${{ inputs.testSuite }}

      # -----------------------------------------------------
      # Xray
      # -----------------------------------------------------

      XRAY_PROJECT_KEY: ${{ inputs.projectKey }}

      XRAY_TEST_PLAN: ${{ inputs.testPlanKey }}


    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4

      # =====================================================
      # NODE.JS
      # =====================================================

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:
          node-version: 22

          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies

        run: npm ci

      # =====================================================
      # INSTALL CHROMIUM ONLY
      # =====================================================

      - name: Install Playwright Chromium

        run: |

          npx playwright install --with-deps chromium

      # =====================================================
      # DISPLAY EXECUTION CONFIGURATION
      # =====================================================

      - name: Display execution configuration

        shell: bash

        run: |

          echo "=============================================="

          echo "PLAYWRIGHT + XRAY EXECUTION"

          echo "=============================================="

          echo ""

          echo "Xray Project:"
          echo "$XRAY_PROJECT_KEY"

          echo ""

          echo "Xray Test Plan:"
          echo "$XRAY_TEST_PLAN"

          echo ""

          echo "Xray Test Execution:"
          echo "$XRAY_TEST_EXECUTION"

          echo ""

          echo "Application Environment:"
          echo "$TEST_ENVIRONMENT"

          echo ""

          echo "Playwright Suite:"
          echo "$TEST_SUITE"

          echo ""

          echo "BASE_URL:"
          echo "$BASE_URL"

          echo ""

          echo "Jira:"
          echo "$JIRA_BASE_URL"

          echo ""

          echo "=============================================="

      # =====================================================
      # VALIDATE CONFIGURATION
      # =====================================================

      - name: Validate configuration

        shell: bash

        run: |

          if [ -z "$BASE_URL" ]; then

            echo "::error::BASE_URL is empty."

            echo "Check the GitHub Environment variable."

            exit 1

          fi


          if [ -z "$JIRA_BASE_URL" ]; then

            echo "::error::JIRA_BASE_URL is empty."

            echo "Check the repository variable."

            exit 1

          fi


          if [ -z "$XRAY_PROJECT_KEY" ]; then

            echo "::error::Xray Project Key is required."

            exit 1

          fi


          if [ -z "$XRAY_TEST_PLAN" ]; then

            echo "::error::Xray Test Plan Key is required."

            exit 1

          fi


          if [ -z "$XRAY_TEST_EXECUTION" ]; then

            echo "::error::Xray Test Execution Key is required."

            exit 1

          fi


          echo "Configuration validation passed."

      # =====================================================
      # RUN PLAYWRIGHT
      # =====================================================

      - name: Run Playwright tests

        id: playwright

        continue-on-error: true

        shell: bash

        run: |

          echo "Running Playwright project: $TEST_SUITE"

          echo "Environment: $TEST_ENVIRONMENT"

          echo "BASE_URL: $BASE_URL"


          if [ -n "${{ inputs.grep }}" ]; then

            echo "Grep: ${{ inputs.grep }}"

            npx playwright test \
              --project="$TEST_SUITE" \
              --grep "${{ inputs.grep }}"

          else

            npx playwright test \
              --project="$TEST_SUITE"

          fi

      # =====================================================
      # VERIFY JUNIT REPORT
      # =====================================================

      - name: Verify JUnit report

        if: always()

        shell: bash

        run: |

          echo "Checking Xray JUnit report..."


          if [ ! -f "xray-report.xml" ]; then

            echo "::error::xray-report.xml was not generated."

            echo ""

            echo "Files in workspace:"

            find . -maxdepth 3 -type f | sort | head -200

            exit 1

          fi


          echo ""

          echo "JUnit report found:"

          ls -lh xray-report.xml

      # =====================================================
      # UPLOAD PLAYWRIGHT ARTIFACTS
      # =====================================================

      - name: Upload Playwright artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: playwright-${{ inputs.testSuite }}-${{ inputs.environment }}

          path: |

            xray-report.xml

            playwright-report/

            test-results/

          if-no-files-found: warn

      # =====================================================
      # IMPORT RESULTS TO XRAY
      # =====================================================

      - name: Import results to Xray

        id: xray

        if: always()

        uses: mikepenz/xray-action@v3.1.1

        with:
          # -------------------------------------------------
          # Xray Cloud authentication
          # -------------------------------------------------

          username: ${{ secrets.XRAYCLOUD_CLIENT_ID }}

          password: ${{ secrets.XRAYCLOUD_CLIENT_SECRET }}

          xrayCloud: "true"

          xrayBaseUrl: ${{ vars.XRAYCLOUD_BASE_URL }}

          # -------------------------------------------------
          # JUnit report
          # -------------------------------------------------

          testFormat: "junit"

          testPaths: "xray-report.xml"

          # -------------------------------------------------
          # Xray objects
          # -------------------------------------------------

          testPlanKey: "${{ inputs.testPlanKey }}"

          projectKey: "${{ inputs.projectKey }}"

 
          # -------------------------------------------------
          # IMPORTANT
          #
          # testEnvironments is intentionally NOT configured.
          #
          # The sample Xray project does not have "dev"
          # configured as a valid Test Environment.
          #
          # Once the Xray environment is configured, we
          # can add it back.
          # -------------------------------------------------

      # =====================================================
      # XRAY RESULT
      # =====================================================

      - name: Display Xray Test Execution

        if: always()

        shell: bash

        run: |

          echo "=============================================="

          echo "XRAY RESULT"

          echo "=============================================="

          echo ""

          echo "Test Plan:"
          echo "$XRAY_TEST_PLAN"

          echo ""

          echo "Test Execution:"
          echo "$XRAY_TEST_EXECUTION"

          echo ""

          echo "=============================================="

      # =====================================================
      # GITHUB SUMMARY
      # =====================================================

      - name: Add execution summary

        if: always()

        shell: bash

        run: |

          echo "# Playwright + Xray Execution" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"


          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"


          echo "| Project | $XRAY_PROJECT_KEY |" \
            >> "$GITHUB_STEP_SUMMARY"


          echo "| Test Plan | $XRAY_TEST_PLAN |" \
            >> "$GITHUB_STEP_SUMMARY"


          echo "| Test Execution | $XRAY_TEST_EXECUTION |" \
            >> "$GITHUB_STEP_SUMMARY"


          echo "| Application Environment | $TEST_ENVIRONMENT |" \
            >> "$GITHUB_STEP_SUMMARY"


          echo "| Test Suite | $TEST_SUITE |" \
            >> "$GITHUB_STEP_SUMMARY"


          echo "| Base URL | $BASE_URL |" \
            >> "$GITHUB_STEP_SUMMARY"


          echo "" >> "$GITHUB_STEP_SUMMARY"


          echo "## Xray" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"


          echo "[Open Test Plan]($JIRA_BASE_URL/browse/$XRAY_TEST_PLAN)" \
            >> "$GITHUB_STEP_SUMMARY"


          echo "" >> "$GITHUB_STEP_SUMMARY"


          echo "[Open Test Execution]($JIRA_BASE_URL/browse/$XRAY_TEST_EXECUTION)" \
            >> "$GITHUB_STEP_SUMMARY"

      # =====================================================
      # FINAL PLAYWRIGHT STATUS
      # =====================================================

      - name: Fail workflow if Playwright failed

        if: steps.playwright.outcome == 'failure'

        shell: bash

        run: |

          echo "::error::Playwright tests failed."

          echo "The Xray import was still attempted."

          exit 1
